
name: Generate Day 1 AI Script and Voice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-script:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git cmake build-essential curl python3 python3-venv

      - name: Download Qwen model
        timeout-minutes: 8
        run: |
          set -euo pipefail

          mkdir -p models
          MODEL="models/qwen.gguf"
          MODEL_URL="https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf?download=true"

          curl -fL --retry 3 --retry-delay 2 \
            --connect-timeout 30 \
            "$MODEL_URL" -o "$MODEL"

          test -s "$MODEL"
          ls -lh "$MODEL"

      - name: Build llama-server
        timeout-minutes: 12
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/ggml-org/llama.cpp.git llama.cpp

          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=ON

          cmake --build llama.cpp/build \
            --config Release \
            --target llama-server \
            -j 2

          LLAMA_SERVER="$GITHUB_WORKSPACE/llama.cpp/build/bin/llama-server"

          if [ ! -x "$LLAMA_SERVER" ]; then
            echo "::error::llama-server was not produced."
            find llama.cpp/build -type f -name 'llama-server*' -print || true
            exit 1
          fi

          echo "LLAMA_SERVER=$LLAMA_SERVER" >> "$GITHUB_ENV"
          echo "llama-server built successfully."
          "$LLAMA_SERVER" --version

      - name: Prepare prompt
        run: |
          set -euo pipefail

          test -s daily_notes/day-001.md
          mkdir -p output

          python3 - <<'PY'
          from pathlib import Path
          import json

          journal = Path("daily_notes/day-001.md").read_text(
              encoding="utf-8"
          )

          system_prompt = (
              "Write a natural, first-person English YouTube Shorts "
              "voice-over script for approximately 45-60 seconds. "
              "Return only the words to be spoken. Do not include "
              "titles, headings, markdown, bullets, scene descriptions, "
              "camera directions, speaker labels, or stage directions. "
              "Start with a compelling but honest spoken hook. "
              "Mention Day 1 of a 90-day transformation, DSA, Java, "
              "Java 8, Spring Boot, microservices, system design, "
              "AI automation, and the goal of building a second source "
              "of income. Use simple, natural spoken English. "
              "Do not invent achievements. Aim for 100-130 words."
          )

          payload = {
              "messages": [
                  {
                      "role": "system",
                      "content": system_prompt
                  },
                  {
                      "role": "user",
                      "content": (
                          "Create the spoken narration from this "
                          "journal entry:\n\n" + journal
                      )
                  }
              ],
              "temperature": 0.5,
              "max_tokens": 220,
              "stream": False
          }

          Path("output/request.json").write_text(
              json.dumps(payload),
              encoding="utf-8"
          )

          print("Prompt request prepared.")
          PY

      - name: Generate narration using HTTP API
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output
          : > output/llama.log

          SERVER="$LLAMA_SERVER"
          MODEL="models/qwen.gguf"

          test -x "$SERVER"
          test -s "$MODEL"

          "$SERVER" \
            --model "$MODEL" \
            --host 127.0.0.1 \
            --port 8080 \
            --ctx-size 4096 \
            --threads 2 \
            > output/llama.log 2>&1 &

          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0

          for i in $(seq 1 90); do
            if curl -fsS \
              http://127.0.0.1:8080/health \
              >/dev/null 2>&1; then
              READY=1
              echo "llama-server is ready."
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::llama-server exited during startup."
              cat output/llama.log || true
              exit 1
            fi

            sleep 4
          done

          if [ "$READY" -ne 1 ]; then
            echo "::error::llama-server did not become ready."
            cat output/llama.log || true
            exit 1
          fi

          if ! curl --fail --silent --show-error \
            --max-time 300 \
            http://127.0.0.1:8080/v1/chat/completions \
            -H "Content-Type: application/json" \
            --data-binary @output/request.json \
            -o output/response.json; then
            echo "::error::Narration generation request failed."
            cat output/llama.log || true
            exit 1
          fi

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          response = json.loads(
              Path("output/response.json").read_text(
                  encoding="utf-8"
              )
          )

          content = response["choices"][0]["message"]["content"].strip()

          if not content:
              raise SystemExit("ERROR: Model returned empty narration.")

          # Remove common Markdown formatting.
          content = re.sub(r"\*\*(.*?)\*\*", r"\1", content)
          content = re.sub(r"__(.*?)__", r"\1", content)
          content = re.sub(r"(?m)^\s*#{1,6}\s*", "", content)

          unwanted = re.compile(
              r"^\s*(?:"
              r"narration script|"
              r"opening shot\b.*|"
              r"closing shot\b.*|"
              r"scene description\b.*|"
              r"camera direction\b.*|"
              r"realistic motivational tone|"
              r"long-term goal|"
              r"day 1\s*[-—:]\s*my 90-day transformation"
              r")\s*$",
              re.IGNORECASE
          )

          lines = []

          for line in content.splitlines():
              line = line.strip()

              if not line or unwanted.match(line):
                  continue

              line = re.sub(r"^\s*>\s?", "", line)
              line = re.sub(
                  r"^Narrator\s*\(Voice[- ]over\)\s*:\s*",
                  "",
                  line,
                  flags=re.IGNORECASE
              )
              line = re.sub(r"[*_]{1,2}", "", line).strip()

              if line:
                  lines.append(line)

          content = re.sub(r"\s+", " ", " ".join(lines)).strip()

          if not content:
              raise SystemExit("ERROR: No narration remained after cleanup.")

          Path("output/script.txt").write_text(
              content + "\n",
              encoding="utf-8"
          )

          print("\n--- GENERATED SCRIPT ---\n")
          print(content)
          print("\n--- END SCRIPT ---")
          print(f"Word count: {len(content.split())}")
          PY

      - name: Validate generated script
        run: |
          set -euo pipefail

          test -s output/script.txt

          WORDS="$(wc -w < output/script.txt | tr -d ' ')"
          echo "Word count: $WORDS"

          if [ "$WORDS" -lt 70 ] || [ "$WORDS" -gt 170 ]; then
            echo "::error::Script must contain 70-170 words."
            cat output/script.txt
            exit 1
          fi

          if grep -Eqi \
            'available commands:|Loading model|JOURNAL ENTRY:|Opening shot:|Closing shot:|Scene description:|Camera direction:|Narration Script|Narrator \(Voice-over\):' \
            output/script.txt; then
            echo "::error::Script contains unwanted headings or directions."
            cat output/script.txt
            exit 1
          fi

          echo "Script passed basic validation."

      - name: Install Piper TTS
        timeout-minutes: 8
        run: |
          set -euo pipefail

          python3 -m venv .venv-tts

          .venv-tts/bin/python -m pip install --upgrade pip
          .venv-tts/bin/python -m pip install piper-tts

          echo "Piper TTS installed successfully."

      - name: Download Piper voice
        timeout-minutes: 5
        run: |
          set -euo pipefail

          mkdir -p voices

          .venv-tts/bin/python -m piper.download_voices \
            en_US-lessac-medium \
            --download-dir voices

          test -s voices/en_US-lessac-medium.onnx
          test -s voices/en_US-lessac-medium.onnx.json

          echo "Piper voice model downloaded successfully."

      - name: Generate Day 1 voice narration
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail

          test -s output/script.txt

          .venv-tts/bin/piper \
            --model voices/en_US-lessac-medium.onnx \
            --output_file output/day-001.wav \
            < output/script.txt

          test -s output/day-001.wav

          python3 - <<'PY'
          import wave
          from pathlib import Path

          audio = Path("output/day-001.wav")

          with wave.open(str(audio), "rb") as wav:
              duration = wav.getnframes() / wav.getframerate()
              sample_rate = wav.getframerate()
              channels = wav.getnchannels()

          if duration <= 0:
              raise SystemExit("ERROR: Generated audio is empty.")

          print("Voice narration generated successfully.")
          print(f"Duration: {duration:.1f} seconds")
          print(f"Sample rate: {sample_rate} Hz")
          print(f"Channels: {channels}")
          print(f"File size: {audio.stat().st_size} bytes")
          PY

      - name: Upload script, voice, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day-001-ai-script
          path: |
            output/script.txt
            output/day-001.wav
            output/llama.log
            output/response.json
          if-no-files-found: warn
          retention-days: 7
