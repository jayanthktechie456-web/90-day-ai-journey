
name: Generate Day 1 AI Script, Voice and Shorts Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-script:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            git cmake build-essential curl python3 python3-venv \
            ffmpeg fonts-dejavu-core

          ffmpeg -version

      - name: Download Qwen model
        timeout-minutes: 8
        run: |
          set -euo pipefail

          mkdir -p models

          MODEL="models/qwen.gguf"
          MODEL_URL="https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf?download=true"

          curl -fL --retry 3 --retry-delay 2 \
            --connect-timeout 30 \
            "$MODEL_URL" -o "$MODEL"

          test -s "$MODEL"
          ls -lh "$MODEL"

      - name: Build llama-server
        timeout-minutes: 12
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/ggml-org/llama.cpp.git llama.cpp

          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=ON

          cmake --build llama.cpp/build \
            --config Release \
            --target llama-server \
            -j 2

          LLAMA_SERVER="$GITHUB_WORKSPACE/llama.cpp/build/bin/llama-server"

          if [ ! -x "$LLAMA_SERVER" ]; then
            echo "::error::llama-server was not produced."
            find llama.cpp/build -type f -name 'llama-server*' -print || true
            exit 1
          fi

          echo "LLAMA_SERVER=$LLAMA_SERVER" >> "$GITHUB_ENV"

          echo "llama-server built successfully."
          "$LLAMA_SERVER" --version

      - name: Prepare prompt
        run: |
          set -euo pipefail

          test -s daily_notes/day-001.md
          mkdir -p output

          python3 - <<'PY'
          from pathlib import Path
          import json

          journal = Path("daily_notes/day-001.md").read_text(
              encoding="utf-8"
          )

          system_prompt = """
          You write natural YouTube Shorts voice-over scripts.

          Produce one short spoken narration in simple English.

          Requirements:
          - Target 100 to 120 words.
          - Write in first person.
          - Start with an interesting but honest hook.
          - Mention Day 1 of my 90-day journey.
          - Mention DSA, Java, Java 8, Spring Boot,
            microservices, system design and AI automation.
          - Mention my goal of building a second source of income.
          - Sound like a real person speaking to the camera.
          - Use one or two short paragraphs.
          - Do not use headings, titles, bullets or numbered lists.
          - Do not explain every technology separately.
          - Do not repeat ideas or copy the journal verbatim.
          - Do not invent achievements.
          - Finish with a complete sentence.
          - Return only the narration.
          """

          payload = {
              "messages": [
                  {
                      "role": "system",
                      "content": system_prompt
                  },
                  {
                      "role": "user",
                      "content": (
                          "Summarize these notes into a concise "
                          "spoken narration. Follow every requirement "
                          "in the system prompt.\n\n" + journal
                      )
                  }
              ],
              "temperature": 0.2,
              "max_tokens": 160,
              "stream": False
          }

          Path("output/request.json").write_text(
              json.dumps(payload),
              encoding="utf-8"
          )

          print("Concise narration prompt prepared.")
          PY

      - name: Generate narration using HTTP API
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output
          : > output/llama.log

          SERVER="$LLAMA_SERVER"
          MODEL="models/qwen.gguf"

          test -x "$SERVER"
          test -s "$MODEL"

          "$SERVER" \
            --model "$MODEL" \
            --host 127.0.0.1 \
            --port 8080 \
            --ctx-size 4096 \
            --threads 2 \
            > output/llama.log 2>&1 &

          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0

          for i in $(seq 1 90); do
            if curl -fsS \
              http://127.0.0.1:8080/health \
              >/dev/null 2>&1; then
              READY=1
              echo "llama-server is ready."
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::llama-server exited during startup."
              cat output/llama.log || true
              exit 1
            fi

            sleep 4
          done

          if [ "$READY" -ne 1 ]; then
            echo "::error::llama-server did not become ready."
            cat output/llama.log || true
            exit 1
          fi

          if ! curl --fail --silent --show-error \
            --max-time 300 \
            http://127.0.0.1:8080/v1/chat/completions \
            -H "Content-Type: application/json" \
            --data-binary @output/request.json \
            -o output/response.json; then
            echo "::error::Narration generation request failed."
            cat output/llama.log || true
            exit 1
          fi

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          response = json.loads(
              Path("output/response.json").read_text(
                  encoding="utf-8"
              )
          )

          content = response["choices"][0]["message"]["content"].strip()

          if not content:
              raise SystemExit("ERROR: Model returned empty narration.")

          # Remove common Markdown formatting.
          content = re.sub(r"\*\*(.*?)\*\*", r"\1", content)
          content = re.sub(r"__(.*?)__", r"\1", content)
          content = re.sub(r"(?m)^\s*#{1,6}\s*", "", content)

          # Remove a common introductory title if the model adds one.
          content = re.sub(
              r"^(?:Today's Journey Begins|"
              r"My 90-Day Transformation|"
              r"Narration Script)\s*[:—-]?\s*",
              "",
              content,
              flags=re.IGNORECASE
          )

          # Remove speaker labels and stage directions.
          content = re.sub(
              r"(?im)^\s*Narrator\s*\(Voice[- ]over\)\s*:\s*",
              "",
              content
          )

          content = re.sub(
              r"(?im)^\s*(?:Opening shot|Closing shot|"
              r"Scene description|Camera direction)\s*:.*$",
              "",
              content
          )

          # Remove Markdown list markers, including inline bullets.
          content = re.sub(
              r"(?<!\S)[-*+]\s+",
              "",
              content
          )

          content = re.sub(r"\s+", " ", content).strip()

          if not content:
              raise SystemExit("ERROR: Narration is empty after cleanup.")

          words = content.split()
          word_count = len(words)

          print("\n--- CLEANED GENERATED SCRIPT ---\n")
          print(content)
          print("\n--- END SCRIPT ---")
          print(f"Word count: {word_count}")

          if word_count < 70 or word_count > 170:
              raise SystemExit(
                  f"ERROR: Script has {word_count} words. "
                  "Expected 70-170 words. "
                  "Reduce the prompt length or adjust generation."
              )

          if content[-1] not in ".!?":
              raise SystemExit(
                  "ERROR: Script appears incomplete because it "
                  "does not end with sentence punctuation."
              )

          Path("output/script.txt").write_text(
              content + "\n",
              encoding="utf-8"
          )

          print("Clean narration saved successfully.")
          PY

      - name: Validate generated script
        run: |
          set -euo pipefail

          test -s output/script.txt

          WORDS="$(wc -w < output/script.txt | tr -d ' ')"
          echo "Word count: $WORDS"

          if [ "$WORDS" -lt 70 ] || [ "$WORDS" -gt 170 ]; then
            echo "::error::Script must contain 70-170 words."
            cat output/script.txt
            exit 1
          fi

          if grep -Eqi \
            'available commands:|Loading model|JOURNAL ENTRY:|Opening shot:|Closing shot:|Scene description:|Camera direction:|Narration Script|Narrator \(Voice-over\):' \
            output/script.txt; then
            echo "::error::Script contains unwanted headings or directions."
            cat output/script.txt
            exit 1
          fi

          echo "Script passed basic validation."

      - name: Install Piper TTS
        timeout-minutes: 8
        run: |
          set -euo pipefail

          python3 -m venv .venv-tts

          .venv-tts/bin/python -m pip install --upgrade pip
          .venv-tts/bin/python -m pip install piper-tts

          echo "Piper TTS installed successfully."

      - name: Download Piper voice
        timeout-minutes: 5
        run: |
          set -euo pipefail

          mkdir -p voices

          .venv-tts/bin/python -m piper.download_voices \
            en_US-lessac-medium \
            --download-dir voices

          test -s voices/en_US-lessac-medium.onnx
          test -s voices/en_US-lessac-medium.onnx.json

          echo "Piper voice model downloaded successfully."

      - name: Generate Day 1 voice narration
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail

          test -s output/script.txt

          .venv-tts/bin/piper \
            --model voices/en_US-lessac-medium.onnx \
            --output_file output/day-001.wav \
            < output/script.txt

          test -s output/day-001.wav

          python3 - <<'PY'
          import wave
          from pathlib import Path

          audio = Path("output/day-001.wav")

          with wave.open(str(audio), "rb") as wav:
              duration = wav.getnframes() / wav.getframerate()
              sample_rate = wav.getframerate()
              channels = wav.getnchannels()

          if duration <= 0:
              raise SystemExit("ERROR: Generated audio is empty.")

          print("Voice narration generated successfully.")
          print(f"Duration: {duration:.1f} seconds")
          print(f"Sample rate: {sample_rate} Hz")
          print(f"Channels: {channels}")
          print(f"File size: {audio.stat().st_size} bytes")
          PY

      - name: Generate timed captions
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re
          import wave

          script = Path("output/script.txt").read_text(
              encoding="utf-8"
          ).strip()

          audio_path = Path("output/day-001.wav")
          srt_path = Path("output/day-001.srt")

          if not script or not audio_path.exists():
              raise SystemExit("Script or audio file is missing.")

          with wave.open(str(audio_path), "rb") as audio:
              duration = audio.getnframes() / audio.getframerate()

          words = re.findall(r"\S+", script)

          if not words or duration <= 0:
              raise SystemExit("Invalid script or audio duration.")

          # Divide narration into readable groups of six words.
          chunks = [
              words[i:i + 6]
              for i in range(0, len(words), 6)
          ]

          # Estimate caption timing from text length.
          weights = [
              sum(len(word) for word in chunk)
              for chunk in chunks
          ]
          total_weight = sum(weights)
          elapsed = 0.0
          entries = []

          def timestamp(seconds):
              ms = round(seconds * 1000)
              hours, ms = divmod(ms, 3600000)
              minutes, ms = divmod(ms, 60000)
              seconds, ms = divmod(ms, 1000)

              return (
                  f"{hours:02}:{minutes:02}:"
                  f"{seconds:02},{ms:03}"
              )

          for index, (chunk, weight) in enumerate(
              zip(chunks, weights), start=1
          ):
              start = elapsed
              elapsed += duration * weight / total_weight

              entries.append(
                  f"{index}\n"
                  f"{timestamp(start)} --> {timestamp(elapsed)}\n"
                  f"{' '.join(chunk)}\n"
              )

          srt_path.write_text(
              "\n".join(entries),
              encoding="utf-8"
          )

          print(f"Created {len(chunks)} caption segments.")
          print(f"Audio duration: {duration:.1f} seconds")
          print(f"Captions saved to: {srt_path}")
          PY

          test -s output/day-001.srt

      - name: Render YouTube Shorts MP4
        timeout-minutes: 10
        run: |
          set -euo pipefail

          test -s output/script.txt
          test -s output/day-001.wav
          test -s output/day-001.srt

          ffmpeg -y \
            -f lavfi \
            -i "color=c=0x101827:s=1080x1920:r=30" \
            -i output/day-001.wav \
            -filter_complex "\
              [0:v]drawbox=x=0:y=0:w=iw:h=18:color=0x38BDF8:t=fill,\
              drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:\
              text='90-DAY SOFTWARE JOURNEY':\
              fontsize=46:fontcolor=0x38BDF8:\
              x=(w-text_w)/2:y=210,\
              drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:\
              text='DAY 01  |  BUILDING IN PUBLIC':\
              fontsize=30:fontcolor=white:\
              x=(w-text_w)/2:y=290,\
              subtitles=output/day-001.srt:\
              force_style='FontName=DejaVu Sans,FontSize=22,\
              PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,\
              BorderStyle=1,Outline=3,Shadow=1,\
              Alignment=2,MarginV=430'\
              [v]" \
            -map "[v]" \
            -map 1:a \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -shortest \
            -movflags +faststart \
            output/day-001.mp4

          test -s output/day-001.mp4

          ffprobe -v error \
            -show_entries stream=codec_name,width,height \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            output/day-001.mp4

          echo "Day 1 vertical video rendered successfully."

      - name: Upload script, voice, video, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: day-001-ai-script
          path: |
            output/script.txt
            output/day-001.wav
            output/day-001.srt
            output/day-001.mp4
            output/llama.log
            output/response.json
          if-no-files-found: warn
          retention-days: 7
