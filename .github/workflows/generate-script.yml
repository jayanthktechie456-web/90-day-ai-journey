
name: Generate Daily AI Script and YouTube Short

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            cmake \
            build-essential \
            curl \
            jq \
            python3 \
            python3-venv \
            ffmpeg \
            fonts-dejavu-core

      # ----------------------------------------------------
      # 1. Download the Qwen model
      # ----------------------------------------------------
      - name: Download Qwen model
        run: |
          mkdir -p models output

          curl -L --fail --retry 3 \
            "https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf" \
            -o models/qwen.gguf

          ls -lh models/qwen.gguf

      # ----------------------------------------------------
      # 2. Build llama.cpp
      # ----------------------------------------------------
      - name: Build llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF

          cmake --build llama.cpp/build \
            --config Release \
            --target llama-server \
            -j 2

      # ----------------------------------------------------
      # 3. Start Qwen server
      # ----------------------------------------------------
      - name: Start Qwen server
        run: |
          set -euo pipefail

          ./llama.cpp/build/bin/llama-server \
            --model models/qwen.gguf \
            --host 127.0.0.1 \
            --port 8080 \
            --ctx-size 4096 \
            --n-gpu-layers 0 \
            > output/llama.log 2>&1 &

          echo $! > output/llama.pid

          READY=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              READY=1
              break
            fi
            sleep 5
          done

          if [ "$READY" -ne 1 ]; then
            cat output/llama.log
            echo "Qwen server failed to start."
            exit 1
          fi

          echo "Qwen server is ready."

      # ----------------------------------------------------
      # 4. Generate conversational narration
      # ----------------------------------------------------
      - name: Generate script with Qwen
        run: |
          set -euo pipefail

          cat > output/prompt.txt <<'PROMPT'
          You are a friendly elder sister explaining technology to her
          younger brother.

          Write one original YouTube Shorts narration in simple,
          conversational English.

          The delivery should feel warm, encouraging, natural and personal.
          Imagine explaining something interesting to a friend, not giving
          a formal classroom lecture.

          Topic:
          Choose one useful and interesting topic from Java, DSA,
          Java 8, Spring Boot, microservices, system design, software
          engineering careers or practical AI automation.

          Requirements:
          - Write 100 to 130 words.
          - Start with a strong curiosity-building hook in the first sentence.
          - Explain one useful idea clearly.
          - Use short, natural sentences.
          - Use contractions where they sound natural.
          - Include conversational transitions.
          - Add a small practical example where useful.
          - End with one memorable takeaway.
          - Do not write a title, headings, bullet points or stage directions.
          - Do not include emojis, markdown or special symbols.
          - Avoid generic introductions such as "Hello everyone".
          - Do not repeat the same hook or conclusion.
          - Write original wording. Do not imitate a specific creator.
          - Output only the narration.
          PROMPT

          jq -n \
            --rawfile prompt output/prompt.txt \
            '{
              model: "qwen",
              messages: [
                {
                  role: "system",
                  content: "You write engaging, natural spoken English for short educational videos."
                },
                {
                  role: "user",
                  content: $prompt
                }
              ],
              temperature: 0.85,
              top_p: 0.9,
              max_tokens: 220
            }' > output/request.json

          curl --fail --silent --show-error \
            http://127.0.0.1:8080/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d @output/request.json \
            -o output/response.json

          jq -r '.choices[0].message.content' \
            output/response.json > output/script.txt

          echo "Generated narration:"
          cat output/script.txt

          WORD_COUNT=$(wc -w < output/script.txt)
          echo "Word count: $WORD_COUNT"

          if [ "$WORD_COUNT" -lt 70 ] || [ "$WORD_COUNT" -gt 170 ]; then
            echo "Narration length is outside the accepted range."
            exit 1
          fi

      # ----------------------------------------------------
      # 5. Install Piper and download a female English voice
      # ----------------------------------------------------
      - name: Install Piper TTS
        run: |
          set -euo pipefail

          python3 -m venv .venv-tts
          .venv-tts/bin/pip install --upgrade pip
          .venv-tts/bin/pip install piper-tts

          mkdir -p voices

          curl -L --fail --retry 3 \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/amy/medium/en_US-amy-medium.onnx" \
            -o voices/en_US-amy-medium.onnx

          curl -L --fail --retry 3 \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/amy/medium/en_US-amy-medium.onnx.json" \
            -o voices/en_US-amy-medium.onnx.json

          ls -lh voices/

      # ----------------------------------------------------
      # 6. Generate warm, slower-paced narration
      # ----------------------------------------------------
      - name: Generate voice narration
        run: |
          set -euo pipefail

          .venv-tts/bin/piper \
            --model voices/en_US-amy-medium.onnx \
            --output_file output/day-001.wav \
            --length-scale 1.08 \
            --sentence-silence 0.35 \
            < output/script.txt

          test -s output/day-001.wav

          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/day-001.wav

      # ----------------------------------------------------
      # 7. Create properly positioned ASS subtitles
      # ----------------------------------------------------
      - name: Generate ASS captions
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          script_path = Path("output/script.txt")
          audio_path = Path("output/day-001.wav")
          ass_path = Path("output/day-001.ass")

          text = script_path.read_text(encoding="utf-8").strip()
          words = re.findall(r"\S+", text)

          duration = float(subprocess.check_output([
              "ffprobe",
              "-v", "error",
              "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1",
              str(audio_path)
          ], text=True).strip())

          # Build caption groups with a maximum of two lines.
          # Each line is kept short enough for mobile viewing.
          groups = []
          current = []
          current_length = 0

          for word in words:
              extra = len(word) + (1 if current else 0)

              if current and (
                  current_length + extra > 30 or len(current) >= 6
              ):
                  groups.append(current)
                  current = []
                  current_length = 0

              current.append(word)
              current_length += len(word) + (1 if len(current) > 1 else 0)

          if current:
              groups.append(current)

          def make_lines(group):
              lines = []
              line = ""

              for word in group:
                  candidate = (line + " " + word).strip()

                  if len(candidate) > 30 and line:
                      lines.append(line)
                      line = word
                  else:
                      line = candidate

              if line:
                  lines.append(line)

              return lines[:2]

          def ass_time(seconds):
              total_cs = round(seconds * 100)
              hours = total_cs // 360000
              minutes = (total_cs % 360000) // 6000
              seconds_part = (total_cs % 6000) // 100
              centiseconds = total_cs % 100
              return (
                  f"{hours}:{minutes:02d}:"
                  f"{seconds_part:02d}.{centiseconds:02d}"
              )

          header = """[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 2
          ScaledBorderAndShadow: yes
          YCbCr Matrix: TV.709

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,DejaVu Sans,50,&H00FFFFFF,&H000000FF,&H00101010,&H80000000,-1,0,0,0,100,100,0,0,1,4,1,2,90,90,390,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """

          # Timing is distributed according to each group's word count.
          # This is approximate timing, not word-level forced alignment.
          total_weight = sum(len(group) for group in groups)
          current_time = 0.0
          events = []

          for group in groups:
              group_duration = duration * len(group) / total_weight
              start = current_time
              end = current_time + group_duration
              current_time = end

              caption = r"\N".join(make_lines(group))
              events.append(
                  "Dialogue: 0,"
                  + ass_time(start)
                  + ","
                  + ass_time(end)
                  + ",Default,,0,0,0,,"
                  + caption
              )

          ass_path.write_text(
              header + "\n".join(events) + "\n",
              encoding="utf-8"
          )

          print(f"Created {ass_path}")
          print(f"Audio duration: {duration:.2f} seconds")
          print(f"Caption groups: {len(groups)}")
          print("Caption style: centered, two lines maximum, safe margins.")
          PY

          echo "ASS subtitle preview:"
          head -n 18 output/day-001.ass

      # ----------------------------------------------------
      # 8. Render vertical video with FFmpeg
      # ----------------------------------------------------
      - name: Render YouTube Short
        run: |
          set -euo pipefail

          DURATION=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/day-001.wav)

          ffmpeg -y \
            -f lavfi \
            -i "color=c=0x101827:s=1080x1920:r=30:d=${DURATION}" \
            -i output/day-001.wav \
            -filter_complex "\
              [0:v]drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:\
              text='TECH MADE SIMPLE':\
              fontcolor=white:fontsize=54:\
              x=(w-text_w)/2:y=180,\
              drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:\
              text='Learn one useful idea every day':\
              fontcolor=0xB8C7D9:fontsize=30:\
              x=(w-text_w)/2:y=260,\
              ass=output/day-001.ass[v]" \
            -map "[v]" \
            -map 1:a \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -pix_fmt yuv420p \
            -r 30 \
            -c:a aac \
            -b:a 128k \
            -shortest \
            -movflags +faststart \
            output/day-001.mp4

          test -s output/day-001.mp4

      # ----------------------------------------------------
      # 9. Verify video and create a caption-check frame
      # ----------------------------------------------------
      - name: Verify video and caption positioning
        run: |
          set -euo pipefail

          echo "Video properties:"
          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            output/day-001.mp4

          echo "Audio properties:"
          ffprobe -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate \
            -of default=noprint_wrappers=1 \
            output/day-001.mp4

          # Extract a frame to inspect caption placement.
          ffmpeg -y \
            -ss 5 \
            -i output/day-001.mp4 \
            -frames:v 1 \
            output/caption-check.png

          echo "Generated video and caption-check frame."

      # ----------------------------------------------------
      # 10. Upload all generated files
      # ----------------------------------------------------
      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: day-001-ai-short
          path: |
            output/script.txt
            output/day-001.wav
            output/day-001.ass
            output/day-001.mp4
            output/caption-check.png
            output/llama.log
            output/response.json
            output/request.json
          if-no-files-found: error
          retention-days: 7
